name: Update contribution calendar

on:
  schedule:
    # 每天北京时间 00:00（UTC 16:00）
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate calendar and refresh count
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_LOGIN: Nanako-Arasaka
        run: python scripts/gen_contrib_svg.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contrib/calendar.svg README.md
          if git diff --cached --quiet; then
            echo "No contribution data changes"
            exit 0
          fi
          git commit -m "chore: refresh contribution calendar [skip ci]"
          git push
